<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Post Job</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<h2>RecruitPro</h2>

<ul>

<li><a href="employer-dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>

<li class="active"><a href="#"><i class="fas fa-plus-circle"></i> Post Job</a></li>

<li><a href="manage-jobs.html"><i class="fas fa-list"></i> Manage Jobs</a></li>

<li><a href="#" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</a></li>

</ul>

</aside>

<main class="content">

<h2>Post a New Job</h2>

<form id="jobForm">

<div class="input-group">

<label>Job Title</label>

<input type="text" id="jobTitle" required>

</div>

<div class="input-group">

<label>Company Name</label>

<input type="text" id="companyName" required>

</div>

<div class="input-group">

<label>Job Category</label>

<input type="text" id="category" required>

</div>

<div class="input-group">

<label>Employment Type</label>

<select id="employmentType">

<option>Full Time</option>

<option>Part Time</option>

<option>Contract</option>

<option>Remote</option>

<option>Internship</option>

</select>

</div>

<div class="input-group">

<label>Location</label>

<input type="text" id="location" required>

</div>

<div class="input-group">

<label>Salary Range</label>

<input type="text" id="salary" required>

</div>

<div class="input-group">

<label>Required Qualification</label>

<input type="text" id="qualification" required>

</div>

<div class="input-group">

<label>Experience</label>

<input type="text" id="experience" required>

</div>

<div class="input-group">

<label>Job Description</label>

<textarea id="description" rows="6" required></textarea>

</div>

<div class="input-group">

<label>Application Deadline</label>

<input type="date" id="deadline" required>

</div>

<button class="btn btn-primary" type="submit">

<i class="fas fa-paper-plane"></i>

Post Job

</button>

</form>

</main>

</div>

<script src="js/auth.js"></script>
<script src="js/post-job.js"></script>

</body>

</html>
