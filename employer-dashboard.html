<body>

<div class="dashboard">

<aside class="sidebar">

<h2>

<i class="fas fa-briefcase"></i>

RecruitPro

</h2>

<ul>

<li class="active">

<a href="#">

<i class="fas fa-home"></i>

Dashboard

</a>

</li>

<li>

<a href="post-job.html">

<i class="fas fa-plus-circle"></i>

Post Job

</a>

</li>

<li>

<a href="manage-jobs.html">

<i class="fas fa-list"></i>

Manage Jobs

</a>

</li>

<li>

<a href="applications.html">

<i class="fas fa-users"></i>

Applications

</a>

</li>

<li>

<a href="company-profile.html">

<i class="fas fa-building"></i>

Company Profile

</a>

</li>

<li>

<a href="#" onclick="logout()">

<i class="fas fa-right-from-bracket"></i>

Logout

</a>

</li>

</ul>

</aside>

<main class="content">

<header class="topbar">

<h2>

Employer Dashboard

</h2>

</h2>

<p>

Manage your company recruitment activities from one place.

</p>

<section class="cards">

<div class="card">

<i class="fas fa-briefcase"></i>

<h3 id="totalJobs">

0

</h3>

<p>Total Jobs</p>

</div>

<div class="card">

<i class="fas fa-check-circle"></i>

<h3 id="activeJobs">

0

</h3>

<p>Active Jobs</p>

</div>

<div class="card">

<i class="fas fa-file-alt"></i>

<h3 id="applications">

0

</h3>

<p>Applications</p>

</div>

<div class="card">

<i class="fas fa-clock"></i>

<h3>

Today

</h3>

<p>Recent Activity</p>

</div>

</section>

<section class="quick-actions">

<a href="post-job.html" class="btn btn-primary">

<i class="fas fa-plus"></i>

Post New Job

<a href="manage-jobs.html" class="btn btn-secondary">

Manage Jobs

</a>
